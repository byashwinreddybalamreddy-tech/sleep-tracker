      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('WebSocket') || args[0].includes('closed without opened'))) {
            return;
          }
          origError.apply(console, args);
