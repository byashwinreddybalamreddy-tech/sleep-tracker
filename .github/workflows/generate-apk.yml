name: Generate Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SyncStudy Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Android APK
        env:
          KEYSTORE_PASSWORD: password123
        run: |
          mkdir -p android-build
          cd android-build
          
          # Generate signing keystore
          keytool -genkey -v -keystore android.keystore -alias syncstudy -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=SyncStudy, OU=App, O=SyncStudy, L=City, S=State, C=US"
          
          # Copy twa manifest
          cp ../twa-manifest.json ./twa-manifest.json
          
          # Build APK with bubblewrap
          echo "$KEYSTORE_PASSWORD" | bubblewrap build --skipVersionCheck
          
          echo "Build finished! Available APK files:"
          ls -la *.apk || find . -name "*.apk"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SyncStudy-Android-APK
          path: |
            android-build/*.apk
            android-build/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
