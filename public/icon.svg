<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(37, 99, 235, 0.25)" stroke-width="12" />

  <!-- Glowing Sync Orbit Arcs -->
  <path d="M 150 180 A 130 130 0 0 1 362 180" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 362 332 A 130 130 0 0 1 150 332" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Sync Arrow Heads -->
  <polygon points="360,150 388,185 348,198" fill="#38bdf8" />
  <polygon points="152,362 124,327 164,314" fill="#38bdf8" />

  <!-- Central Focus Node / Clock Hub -->
  <circle cx="256" cy="256" r="64" fill="url(#primaryGrad)" />
  <circle cx="256" cy="256" r="48" fill="#0f172a" />

  <!-- Clock / Alarm Hands indicating Routine Precision -->
  <path d="M 256 256 L 256 226" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
  <path d="M 256 256 L 278 256" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- Sparkle of optimization at top right -->
  <path d="M 370 120 Q 380 135 395 145 Q 380 155 370 170 Q 360 155 345 145 Q 360 135 370 120 Z" fill="url(#accentGrad)" />
</svg>
